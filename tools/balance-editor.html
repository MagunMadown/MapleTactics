<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maple · Balance Workbench</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#101816;color:#e8f1ed}*{box-sizing:border-box}body{margin:0}header{padding:24px 30px;border-bottom:1px solid #31443c;background:#19251f}h1{font-size:24px;margin:0 0 8px}p{color:#aebfb5;line-height:1.6}button,.file{font:inherit;border:1px solid #4a6555;background:#233b2d;color:#e6f5eb;border-radius:6px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #b1e990;outline-offset:2px}.file input{max-width:280px}nav{width:300px;flex-shrink:0;padding:20px;border-right:1px solid #31443c;overflow:auto;height:calc(100vh - 200px)}nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:9px;font-size:12px;overflow-wrap:anywhere}nav button[aria-current=true]{background:#456036;border-color:#b1e990}nav input{width:100%;margin-bottom:14px;padding:10px;background:#101816;color:inherit;border:1px solid #4a6555}main{display:flex}article{padding:24px;min-width:0;flex:1}h2{font-size:21px;margin:0 0 10px}#note{padding:12px;border-left:3px solid #aad98c;background:#1d2c23}.grid{overflow:auto;max-height:55vh;margin-top:20px}table{border-collapse:collapse;font-size:12px}th,td{border:1px solid #35473d;padding:8px;min-width:140px}th{position:sticky;top:0;background:#26392d;z-index:1;text-align:left}td input{width:100%;min-width:120px;border:0;padding:8px;background:#15221b;color:#e8f1ed;font:inherit}td input:read-only{color:#91a297;background:#202621}th small{display:block;color:#c7b983;font-weight:normal;max-width:240px;margin-top:6px}#issues{white-space:pre-wrap;max-height:220px;overflow:auto;color:#efbe9c}summary{cursor:pointer;padding:18px 0;color:#cbb78d}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}#status{color:#cce6b8}footer{margin-top:18px;color:#96aa9d}@media(max-width:800px){main{display:block}nav{width:100%;height:200px}article{padding:16px}}
</style>
<header><h1>Maple · Balance Workbench</h1><p>CSV의 실제 키와 사용 상태를 확인하고 수정합니다. 파일은 이 브라우저 안에서만 처리됩니다.</p>
<div class="toolbar"><label class="file">데이터 폴더 열기 <input id="folder" type="file" webkitdirectory multiple></label><button id="check">전체 검사</button><button id="export" disabled>검사 후 현재 CSV 다운로드</button><span id="status">03_Data 폴더를 선택하세요.</span></div></header>
<main><nav><input id="search" aria-label="테이블 검색" placeholder="테이블 검색"><div id="active"></div><details><summary>구형 호환용 · 읽기 전용</summary><div id="legacy"></div></details></nav>
<article><h2 id="title">테이블을 선택하세요</h2><div id="note">구형 유니온 테이블은 별도로 분리됩니다. 참조 관계를 컬럼 이름으로 추정하지 않습니다.</div><div class="grid" id="grid"></div><pre id="issues" aria-live="polite"></pre><footer>다운로드는 원본 파일을 덮어쓰지 않습니다. 변경 CSV를 적용한 뒤 Maker Refresh와 콘텐츠 검증을 실행하세요.</footer></article></main>
<script src="balance-schema.js"></script><script>
"use strict";
const S=BalanceSchema,$=id=>document.getElementById(id);
let tables=Object.create(null),selected="";
function status(s){$("status").textContent=s}
function list(){
  $("active").replaceChildren();$("legacy").replaceChildren();
  const q=$("search").value.toLowerCase();
  for(const name of Object.keys(tables).sort()){
    if(!name.toLowerCase().includes(q))continue;
    const m=S.meta(name),b=document.createElement("button");
    b.textContent=name+(tables[name].dirty?" •":"");
    b.setAttribute("aria-current",String(name===selected));b.onclick=()=>openTable(name);
    $(m.legacy?"legacy":"active").append(b);
  }
}
function openTable(name){
  selected=name;const t=tables[name],m=S.meta(name);
  $("title").textContent=name;
  $("note").textContent=(m.readonly?"읽기 전용 · ":"편집 가능 · ")+"기본키: "+(m.key.join(" + ")||"미등록")+"\n"+m.note;
  $("export").disabled=m.readonly;
  const table=document.createElement("table"),head=document.createElement("tr");
  for(const c of t.headers){
    const th=document.createElement("th"),rule=m.columns[c]||{};
    th.textContent=rule.label||c;
    if(rule.note||rule.ref){const small=document.createElement("small");small.textContent=rule.note||"참조: "+rule.ref.join(".");th.append(small);}
    head.append(th);
  }
  const thead=document.createElement("thead");thead.append(head);table.append(thead);
  const body=document.createElement("tbody");
  t.rows.forEach((row,index)=>{
    const tr=document.createElement("tr");
    for(const c of t.headers){
      const td=document.createElement("td"),input=document.createElement("input");
      input.value=row[c];input.readOnly=m.readonly||!!m.columns[c]?.readonly;
      input.setAttribute("aria-label",name+" "+(index+2)+"행 "+c);
      input.oninput=()=>{row[c]=input.value;t.dirty=true;status("수정됨 · 내보내기 전 검사 필요");list()};
      td.append(input);tr.append(td);
    }
    body.append(tr);
  });
  table.append(body);$("grid").replaceChildren(table);list();
}
function check(){
  const issues=S.validate(tables);
  $("issues").textContent=issues.map(x=>x.table+" ["+x.row+"] "+x.column+" — "+x.code).join("\n");
  status(Object.keys(tables).length+"개 테이블 · 오류 "+issues.length+"개");
  return issues;
}
$("folder").onchange=async event=>{
  if(Object.values(tables).some(t=>t.dirty)&&!confirm("다운로드하지 않은 수정이 있습니다. 다른 폴더를 열까요?"))return;
  const next=Object.create(null),errors=[];
  for(const file of event.target.files){
    if(!file.name.toLowerCase().endsWith(".csv"))continue;
    const name=file.name.slice(0,-4);
    try{if(next[name])throw Error("같은 이름의 CSV가 두 개 있습니다");next[name]=S.parseCSV(new TextDecoder("utf-8",{fatal:true,ignoreBOM:true}).decode(await file.arrayBuffer()));}
    catch(e){errors.push(file.webkitRelativePath+": "+e.message)}
  }
  if(errors.length){$("issues").textContent=errors.join("\n");status("불러오기 실패 · 기존 데이터 유지");return;}
  tables=next;selected="";list();$("grid").replaceChildren();$("export").disabled=true;
  check();const first=Object.keys(tables).find(n=>!S.meta(n).legacy);if(first)openTable(first);
};
$("search").oninput=list;$("check").onclick=check;
$("export").onclick=()=>{
  if(!selected||S.meta(selected).readonly)return;
  if(check().length){status("오류를 수정해야 다운로드할 수 있습니다.");return;}
  const url=URL.createObjectURL(new Blob([S.serializeCSV(tables[selected])],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=selected+".csv";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);status(selected+".csv 다운로드 요청됨");
};
window.addEventListener("beforeunload",e=>{if(Object.values(tables).some(t=>t.dirty)){e.preventDefault();e.returnValue=""}});
</script></html>
